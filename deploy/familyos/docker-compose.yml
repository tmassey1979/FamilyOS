# Family OS production stack behind Traefik (proxy network).
# API: ghcr.io/tmassey1979/familyos-api:latest (make package Public if pull fails)
# Keycloak: official image + realm from public GitHub raw (avoids private GHCR)

name: familyos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familyos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    profiles: ["messaging"]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-familyos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-familyos}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 12

  # Fetch realm JSON into a shared volume (public GitHub raw — no GHCR auth)
  keycloak-realm:
    image: curlimages/curl:8.10.1
    restart: "no"
    volumes:
      - keycloak_import:/import
    command:
      - -fsSL
      - -o
      - /import/realm-export.json
      - https://raw.githubusercontent.com/tmassey1979/FamilyOS/main/docker/keycloak/realm-export.json
    # needs outbound HTTPS to GitHub (internal network blocks egress)
    networks:
      - proxy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: auth.${DOMAIN}
      KC_HOSTNAME_URL: https://auth.${DOMAIN}
      KC_HOSTNAME_ADMIN_URL: https://auth.${DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: 9000
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      JAVA_OPTS: "-Xms64m -Xmx256m"
      FAMILYOS_KC_IMPORT_REV: "5"
    volumes:
      - keycloak_import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-realm:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=le
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.http.routers.keycloak.middlewares=sec-headers@file

  api:
    image: ghcr.io/tmassey1979/familyos-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-familyos};Username=${POSTGRES_USER:-familyos};Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: "https://auth.${DOMAIN}/realms/familyos"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/familyos/.well-known/openid-configuration"
      Keycloak__Audience: familyos-mobile
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-familyos}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Auth__UseDevBypass: ${AUTH_USE_DEV_BYPASS:-false}
      PostHog__ApiKey: ${POSTHOG_API_KEY:-}
      PostHog__Host: ${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.familyos-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.familyos-api.entrypoints=websecure
      - traefik.http.routers.familyos-api.tls.certresolver=le
      - traefik.http.services.familyos-api.loadbalancer.server.port=5080
      - traefik.http.routers.familyos-api.middlewares=sec-headers@file

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../../deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    depends_on:
      - api

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
      - proxy
    depends_on:
      - prometheus
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana.middlewares=sec-headers@file

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  keycloak_import:

networks:
  proxy:
    external: true
  internal:
    driver: bridge
    internal: true

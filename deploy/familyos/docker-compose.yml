# Family OS — Keycloak uses official quay image; realm JSON inlined (no GHCR pull needed)

name: familyos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familyos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    profiles: ["messaging"]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-familyos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-familyos}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/keycloak/data/import
        cat > /opt/keycloak/data/import/realm-export.json << 'REALMEOF'
{
  "realm": "familyos",
  "enabled": true,
  "displayName": "Family OS",
  "sslRequired": "none",
  "registrationAllowed": true,
  "loginWithEmailAllowed": true,
  "duplicateEmailsAllowed": false,
  "resetPasswordAllowed": true,
  "editUsernameAllowed": false,
  "bruteForceProtected": true,
  "loginTheme": "keycloak.v2",
  "accountTheme": "keycloak.v2",
  "emailTheme": "keycloak",
  "defaultSignatureAlgorithm": "RS256",
  "clients": [
    {
      "clientId": "familyos-mobile",
      "name": "Family OS Mobile",
      "enabled": true,
      "publicClient": true,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "protocol": "openid-connect",
      "rootUrl": "familyos://",
      "baseUrl": "familyos://auth",
      "redirectUris": [
        "familyos://*",
        "familyos://auth",
        "familyos://auth/*",
        "exp://*",
        "http://localhost:*",
        "http://127.0.0.1:*",
        "https://*.sslip.io/*",
        "https://18.226.226.118.sslip.io/*",
        "https://auth.expo.io/*",
        "https://*.expo.dev/*",
        "https://*.exp.direct/*"
      ],
      "webOrigins": ["*"],
      "attributes": {
        "pkce.code.challenge.method": "S256",
        "post.logout.redirect.uris": "+"
      },
      "fullScopeAllowed": true,
      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
      "optionalClientScopes": ["address", "phone", "offline_access", "microprofile-jwt"]
    },
    {
      "clientId": "familyos-api",
      "enabled": true,
      "publicClient": false,
      "secret": "familyos-api-secret-change-in-prod",
      "serviceAccountsEnabled": true,
      "standardFlowEnabled": false,
      "protocol": "openid-connect",
      "bearerOnly": true
    }
  ],
  "users": [
    {
      "username": "terry.owner",
      "email": "terry@familyos.local",
      "firstName": "Terry",
      "lastName": "Owner",
      "enabled": true,
      "emailVerified": true,
      "credentials": [{ "type": "password", "value": "password", "temporary": false }]
    },
    {
      "username": "michelle.adult",
      "email": "michelle@familyos.local",
      "firstName": "Michelle",
      "lastName": "Adult",
      "enabled": true,
      "emailVerified": true,
      "credentials": [{ "type": "password", "value": "password", "temporary": false }]
    },
    {
      "username": "mia.teen",
      "email": "mia@familyos.local",
      "firstName": "Mia",
      "lastName": "Teen",
      "enabled": true,
      "emailVerified": true,
      "credentials": [{ "type": "password", "value": "password", "temporary": false }]
    },
    {
      "username": "eli.child",
      "email": "eli@familyos.local",
      "firstName": "Eli",
      "lastName": "Child",
      "enabled": true,
      "emailVerified": true,
      "credentials": [{ "type": "password", "value": "password", "temporary": false }]
    }
  ],
  "roles": {
    "realm": [{ "name": "user", "description": "Standard Family OS user" }]
  }
}
        REALMEOF
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: auth.${DOMAIN}
      KC_HOSTNAME_URL: https://auth.${DOMAIN}
      KC_HOSTNAME_ADMIN_URL: https://auth.${DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: 9000
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      JAVA_OPTS: "-Xms64m -Xmx256m"
      FAMILYOS_KC_IMPORT_REV: "7"
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=le
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.http.routers.keycloak.middlewares=sec-headers@file

  api:
    image: ghcr.io/tmassey1979/familyos-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-familyos};Username=${POSTGRES_USER:-familyos};Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: "https://auth.${DOMAIN}/realms/familyos"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/familyos/.well-known/openid-configuration"
      Keycloak__Audience: familyos-mobile
      Seed__Enabled: ${SEED_ENABLED:-true}
      Auth__UseDevBypass: ${AUTH_USE_DEV_BYPASS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.familyos-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.familyos-api.entrypoints=websecure
      - traefik.http.routers.familyos-api.tls.certresolver=le
      - traefik.http.services.familyos-api.loadbalancer.server.port=5080
      - traefik.http.routers.familyos-api.middlewares=sec-headers@file

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  proxy:
    external: true
  internal:
    driver: bridge
    internal: true

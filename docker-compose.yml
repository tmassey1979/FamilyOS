name: familyos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyos
      POSTGRES_PASSWORD: familyos_dev_password
      POSTGRES_DB: familyos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyos -d familyos"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: familyos
      RABBITMQ_DEFAULT_PASS: familyos_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=familyos;Username=familyos;Password=familyos_dev_password"
      Keycloak__Authority: "http://keycloak:8080/realms/familyos"
      Keycloak__Audience: "familyos-mobile"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: familyos
      RabbitMQ__Password: familyos_dev_password
      Seed__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  postgres_data:
  rabbitmq_data:

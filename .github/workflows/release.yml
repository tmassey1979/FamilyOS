name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when not triggered by a tag"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      eas_platforms:
        description: "EAS platforms to build"
        required: true
        default: all
        type: choice
        options: [all, android, ios]
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-api:
    name: Version, test, publish API
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            BUMP="${{ github.event.inputs.bump }}"
            BUMP=${BUMP:-patch}
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Restore & build
        run: |
          dotnet restore FamilyOS.sln
          dotnet build FamilyOS.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test FamilyOS.sln -c Release --no-build --verbosity minimal

      - name: Publish API
        run: |
          dotnet publish src/FamilyOS.Api/FamilyOS.Api.csproj \
            -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./publish/api
          (cd publish && zip -r "../FamilyOS-api-v${{ steps.version.outputs.version }}.zip" api)

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-zip
          path: FamilyOS-api-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Family OS ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: FamilyOS-api-v${{ steps.version.outputs.version }}.zip
          body: |
            ## Family OS ${{ steps.version.outputs.tag }}

            ### API
            ```bash
            docker compose up --build -d
            ```
            API: http://localhost:5080/swagger

            ### Mobile
            Every release builds **both**:
            - `FamilyOS-android-vX.Y.Z.aab` — Play Store (AAB)
            - `FamilyOS-android-vX.Y.Z.apk` — sideload / direct install
            Artifacts attach to this release when the EAS build job succeeds.
            Builds: https://expo.dev/accounts/tmassey1979/projects/familyos/builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand EAS brand bundle (real PNGs)
        working-directory: .
        id: expand_eas_brand
        continue-on-error: true
        run: |
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py
          else
            echo "No expand-eas-brand-bundle.py — skip"
            exit 1
          fi

      - name: Expand brand assets (brand-source b64)
        working-directory: .
        id: expand_brand
        continue-on-error: true
        if: steps.expand_eas_brand.outcome != 'success'
        run: python3 scripts/expand-assets.py

      - name: Seed brand PNGs if expand failed
        working-directory: .
        if: steps.expand_eas_brand.outcome != 'success' && steps.expand_brand.outcome != 'success'
        run: |
          if [[ -f scripts/assemble-seed-brand.py ]]; then
            python3 scripts/assemble-seed-brand.py --run || python3 scripts/assemble-seed-brand.py
          elif [[ -f scripts/seed-brand-assets.py ]]; then
            python3 scripts/seed-brand-assets.py
          else
            echo "::error::Brand expand failed and no seed fallback present"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck

  eas-build:
    name: EAS build
    needs: [release-api, mobile-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EAS brand bundle (real PNGs)
        working-directory: .
        id: expand_eas_brand
        continue-on-error: true
        run: |
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py
          else
            echo "No expand-eas-brand-bundle.py — skip"
            exit 1
          fi

      - name: Expand brand assets (brand-source b64)
        working-directory: .
        id: expand_brand
        continue-on-error: true
        if: steps.expand_eas_brand.outcome != 'success'
        run: python3 scripts/expand-assets.py

      - name: Seed brand PNGs if expand failed
        working-directory: .
        if: steps.expand_eas_brand.outcome != 'success' && steps.expand_brand.outcome != 'success'
        run: |
          if [[ -f scripts/assemble-seed-brand.py ]]; then
            python3 scripts/assemble-seed-brand.py --run || python3 scripts/assemble-seed-brand.py
          elif [[ -f scripts/seed-brand-assets.py ]]; then
            python3 scripts/seed-brand-assets.py
          else
            echo "::error::Brand expand failed and no seed fallback present"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Sync app version from release tag
        run: |
          VERSION="${{ needs.release-api.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('Set expo.version to', process.env.VERSION);
          "
        env:
          VERSION: ${{ needs.release-api.outputs.version }}

      - name: Check EAS project linkage
        id: eas_ready
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN secret is not set. Skipping EAS build."
            exit 0
          fi
          if ! grep -q '\"projectId\"' app.json 2>/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No EAS projectId in app.json."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: EAS build (AAB + APK)
        id: eas
        if: steps.eas_ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          PLATFORMS="${{ github.event.inputs.eas_platforms }}"
          PLATFORMS=${PLATFORMS:-all}
          TAG_MSG="Family OS ${{ needs.release-api.outputs.tag }}"
          mkdir -p /tmp/eas-artifacts
          : > /tmp/eas-all-builds.json

          # Android: always build both AAB (Play Store) and APK (sideload)
          # iOS: single production profile when requested
          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == "android" ]]; then
            echo "==> EAS Android AAB (production)"
            eas build \
              --profile production \
              --platform android \
              --non-interactive \
              --wait \
              --json \
              --message "$TAG_MSG (AAB)" \
              >> /tmp/eas-all-builds.json
            echo "" >> /tmp/eas-all-builds.json

            echo "==> EAS Android APK (production-apk)"
            eas build \
              --profile production-apk \
              --platform android \
              --non-interactive \
              --wait \
              --json \
              --message "$TAG_MSG (APK)" \
              >> /tmp/eas-all-builds.json
            echo "" >> /tmp/eas-all-builds.json
          fi

          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == "ios" ]]; then
            echo "==> EAS iOS (production)"
            eas build \
              --profile production \
              --platform ios \
              --non-interactive \
              --wait \
              --json \
              --message "$TAG_MSG (iOS)" \
              >> /tmp/eas-all-builds.json
            echo "" >> /tmp/eas-all-builds.json
          fi

          cat /tmp/eas-all-builds.json

          python3 << 'PY'
          import json, os, sys, urllib.request
          from urllib.parse import urlparse

          token = os.environ.get("EXPO_TOKEN", "")
          version = os.environ.get("VERSION", "0.0.0")
          raw = open("/tmp/eas-all-builds.json").read().strip()
          builds = []
          buf = ""
          depth = 0
          in_str = False
          esc = False
          for ch in raw:
              buf += ch
              if in_str:
                  if esc:
                      esc = False
                  elif ch == "\\":
                      esc = True
                  elif ch == '"':
                      in_str = False
                  continue
              if ch == '"':
                  in_str = True
              elif ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0 and buf.strip():
                      try:
                          obj = json.loads(buf.strip())
                          if isinstance(obj, list):
                              builds.extend(obj)
                          else:
                              builds.append(obj)
                      except json.JSONDecodeError as e:
                          print(f"::warning::skip bad json chunk: {e}")
                      buf = ""
          if buf.strip():
              try:
                  obj = json.loads(buf.strip())
                  if isinstance(obj, list):
                      builds.extend(obj)
                  else:
                      builds.append(obj)
              except json.JSONDecodeError:
                  pass

          if not builds:
              print("::error::No EAS build results parsed")
              sys.exit(1)

          downloaded = []
          used_names = set()
          for b in builds:
              status = (b.get("status") or "").upper()
              platform = (b.get("platform") or "unknown").lower()
              bid = b.get("id") or "unknown"
              profile = str(b.get("buildProfile") or b.get("profile") or "")
              arts = b.get("artifacts") or {}
              url = arts.get("applicationArchiveUrl") or arts.get("buildUrl")
              if not url:
                  print(f"::warning::Build {bid} status={status} missing artifact URL")
                  continue
              if status not in ("FINISHED", "COMPLETE", "COMPLETED"):
                  print(f"::warning::Build {bid} status={status}")

              path_lower = urlparse(url).path.lower()
              if platform == "android":
                  if path_lower.endswith(".apk") or "production-apk" in profile or profile.endswith("apk"):
                      ext = ".apk"
                  elif path_lower.endswith(".aab") or "app-bundle" in profile or profile == "production":
                      ext = ".aab"
                  else:
                      ext = ".aab"
              elif platform == "ios":
                  ext = ".ipa"
              else:
                  ext = ".bin"

              name = f"FamilyOS-{platform}-v{version}{ext}"
              if name in used_names:
                  name = f"FamilyOS-{platform}-{profile or 'extra'}-v{version}{ext}"
              used_names.add(name)
              path = f"/tmp/eas-artifacts/{name}"
              print(f"Downloading {platform}/{profile or 'default'} -> {name}")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "FamilyOS-Release-CI",
              })
              try:
                  with urllib.request.urlopen(req, timeout=300) as r, open(path, "wb") as out:
                      out.write(r.read())
              except Exception as e:
                  print(f"Auth download failed ({e}); retrying without Authorization header")
                  req2 = urllib.request.Request(url, headers={"User-Agent": "FamilyOS-Release-CI"})
                  with urllib.request.urlopen(req2, timeout=300) as r, open(path, "wb") as out:
                      out.write(r.read())
              size = os.path.getsize(path)
              print(f"  saved {size} bytes")
              if size < 1000:
                  print("::error::Artifact too small — likely an error page")
                  sys.exit(1)
              downloaded.append(path)

          if not downloaded:
              print("::error::No EAS artifacts downloaded")
              sys.exit(1)

          open("/tmp/eas-artifact-list.txt", "w").write("\n".join(downloaded) + "\n")
          print(f"Downloaded {len(downloaded)} artifact(s)")
          PY
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ needs.release-api.outputs.version }}

      - name: Upload mobile artifacts to GitHub Release
        if: steps.eas_ready.outputs.ready == 'true' && steps.eas.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-api.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la /tmp/eas-artifacts/
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Uploading $f to release $TAG"
            gh release upload "$TAG" "$f" --clobber --repo "${{ github.repository }}"
          done < /tmp/eas-artifact-list.txt
          echo "Attached mobile artifacts to https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Summary
        if: always()
        run: |
          echo "## EAS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ needs.release-api.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ needs.release-api.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready: \`${{ steps.eas_ready.outputs.ready }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Builds: https://expo.dev/accounts/tmassey1979/projects/familyos/builds" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/eas-artifact-list.txt ]; then
            echo "- Artifacts:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r f; do echo "  - \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"; done < /tmp/eas-artifact-list.txt
          fi

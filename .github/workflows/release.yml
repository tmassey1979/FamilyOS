name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when not triggered by a tag"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      eas_platforms:
        description: "EAS platforms to build"
        required: true
        default: all
        type: choice
        options: [all, android, ios]
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-api:
    name: Version, test, publish API
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            BUMP="${{ github.event.inputs.bump }}"
            BUMP=${BUMP:-patch}
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Restore & build
        run: |
          dotnet restore FamilyOS.sln
          dotnet build FamilyOS.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test FamilyOS.sln -c Release --no-build --verbosity minimal

      - name: Publish API
        run: |
          dotnet publish src/FamilyOS.Api/FamilyOS.Api.csproj \
            -c Release --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./publish/api
          (cd publish && zip -r "../FamilyOS-api-v${{ steps.version.outputs.version }}.zip" api)

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-zip
          path: FamilyOS-api-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Family OS ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: FamilyOS-api-v${{ steps.version.outputs.version }}.zip
          body: |
            ## Family OS ${{ steps.version.outputs.tag }}

            ### API
            ```bash
            docker compose up --build -d
            ```
            API: http://localhost:5080/swagger

            ### Mobile
            EAS production builds are triggered by this release workflow when `EXPO_TOKEN` is configured.
            See the **EAS build** job logs for Android / iOS artifact links on expo.dev.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck

  eas-build:
    name: EAS build
    needs: [release-api, mobile-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync app version from release tag
        run: |
          VERSION="${{ needs.release-api.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('Set expo.version to', process.env.VERSION);
          "
        env:
          VERSION: ${{ needs.release-api.outputs.version }}

      - name: Check EAS project linkage
        id: eas_ready
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN secret is not set. Skipping EAS build."
            exit 0
          fi
          if ! grep -q '"projectId"' app.json 2>/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No EAS projectId in app.json."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: EAS build (production)
        if: steps.eas_ready.outputs.ready == 'true'
        run: |
          PLATFORMS="${{ github.event.inputs.eas_platforms }}"
          PLATFORMS=${PLATFORMS:-all}
          echo "Building platforms: $PLATFORMS"
          eas build \
            --profile production \
            --platform "$PLATFORMS" \
            --non-interactive \
            --message "Family OS ${{ needs.release-api.outputs.tag }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## EAS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ needs.release-api.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready: \`${{ steps.eas_ready.outputs.ready }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Builds: https://expo.dev/accounts/tmassey1979/projects/familyos/builds" >> "$GITHUB_STEP_SUMMARY"

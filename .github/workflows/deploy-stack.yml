# Redeploy Family OS on the server via Portainer (main only).
name: Deploy stack (Portainer)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why redeploy
        required: false
        default: manual
  workflow_call:

permissions:
  contents: read

jobs:
  redeploy:
    name: Portainer / server redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        id: guard
        run: |
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          echo "ref=$REF event=$EVENT"
          if [ "$EVENT" = "pull_request" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$REF" != "refs/heads/main" ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$EVENT" != "workflow_call" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Redeploy
        id: deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          MODE=""
          if [ -n "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "Portainer webhook"
            code=$(curl -sS -o /tmp/pw.out -w "%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL" -H "Content-Type: application/json" --max-time 120 || echo "000")
            echo "HTTP $code"; head -c 400 /tmp/pw.out 2>/dev/null || true; echo
            if [ "$code" = "200" ] || [ "$code" = "202" ] || [ "$code" = "204" ]; then MODE=webhook; else echo "::warning::Webhook HTTP $code"; fi
          fi
          if [ -z "$MODE" ] && [ -n "${PORTAINER_URL:-}" ] && [ -n "${PORTAINER_API_KEY:-}" ]; then
            BASE="${PORTAINER_URL%/}"; EP="${PORTAINER_ENDPOINT_ID:-1}"; STACK_ID="${PORTAINER_STACK_ID:-}"
            echo "Portainer list stacks"
            list_code=$(curl -sS -o /tmp/ps.out -w "%{http_code}" -H "X-API-Key: ${PORTAINER_API_KEY}" "${BASE}/api/stacks" --max-time 60 || echo "000")
            echo "List HTTP $list_code"
            if [ "$list_code" = "200" ]; then
              python3 -c 'import json;from pathlib import Path;stacks=json.loads(Path("/tmp/ps.out").read_text()); [print("  id=%s name=%r endpoint=%s type=%s"%(s.get("Id"),s.get("Name"),s.get("EndpointId"),s.get("Type"))) for s in (stacks if isinstance(stacks,list) else [])]; names={"familyos","family-os","family_os"}; match=next((s for s in stacks if str(s.get("Name") or "").lower() in names),None); match and (Path("/tmp/auto_stack_id").write_text(str(match["Id"])), Path("/tmp/auto_endpoint_id").write_text(str(match.get("EndpointId") or "1")), print("Auto-matched", match.get("Name"), match.get("Id")))'
              if [ -z "$STACK_ID" ] && [ -f /tmp/auto_stack_id ]; then STACK_ID=$(cat /tmp/auto_stack_id); echo "Using auto stack id=$STACK_ID"; fi
              if [ -f /tmp/auto_endpoint_id ] && [ -z "${PORTAINER_ENDPOINT_ID:-}" ]; then EP=$(cat /tmp/auto_endpoint_id); fi
            else head -c 400 /tmp/ps.out 2>/dev/null || true; echo; fi
            if [ -n "$STACK_ID" ]; then
              echo "Portainer API git/redeploy stack=$STACK_ID endpoint=$EP"
              code=$(curl -sS -o /tmp/pa.out -w "%{http_code}" -X PUT "${BASE}/api/stacks/${STACK_ID}/git/redeploy?endpointId=${EP}" -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Content-Type: application/json" -d '{"PullImage":true,"RepositoryAuthentication":false}' --max-time 300 || echo "000")
              echo "HTTP $code"; head -c 600 /tmp/pa.out 2>/dev/null || true; echo
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then MODE=api-git
              elif [ "$code" = "404" ] && [ -f /tmp/auto_stack_id ]; then
                AUTO=$(cat /tmp/auto_stack_id)
                if [ "$AUTO" != "$STACK_ID" ]; then
                  echo "Retry auto id=$AUTO"
                  code=$(curl -sS -o /tmp/pa.out -w "%{http_code}" -X PUT "${BASE}/api/stacks/${AUTO}/git/redeploy?endpointId=${EP}" -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Content-Type: application/json" -d '{"PullImage":true,"RepositoryAuthentication":false}' --max-time 300 || echo "000")
                  echo "HTTP $code"; head -c 600 /tmp/pa.out 2>/dev/null || true; echo
                  if [ "$code" = "200" ] || [ "$code" = "204" ]; then MODE=api-git; fi
                fi
              fi
              if [ -z "$MODE" ]; then echo "::warning::API failed HTTP ${code:-?}"; fi
            else echo "::warning::No stack id"; fi
          fi
          if [ -z "$MODE" ] && [ -n "${DEPLOY_SSH_HOST:-}" ] && [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            echo "SSH deploy"
            install -m 600 /dev/null /tmp/deploy_key
            printf "%s\n" "$DEPLOY_SSH_KEY" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$DEPLOY_SSH_HOST" "set -euo pipefail; cd /opt/familyos; sudo git fetch origin; sudo git checkout main; sudo git pull --ff-only origin main; sudo docker compose -f deploy/familyos/docker-compose.yml --env-file deploy/familyos/.env up -d --build"
            rm -f /tmp/deploy_key
            MODE=ssh
          fi
          if [ -z "$MODE" ]; then
            echo "::error::Deploy failed. Fix PORTAINER_STACK_ID from list above."
            echo "mode=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Redeploy OK via $MODE"

      - name: Summary
        if: always()
        run: |
          echo "## Deploy stack" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.deploy.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"

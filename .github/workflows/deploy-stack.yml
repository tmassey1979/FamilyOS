# Redeploy Family OS on AWS via Portainer (webhook preferred).
# Secrets (repo → Settings → Secrets → Actions):
#   PORTAINER_WEBHOOK_URL  preferred — Stack webhook URL from Portainer UI
#   PORTAINER_URL          https://portainer.18.226.226.118.sslip.io
#   PORTAINER_API_KEY      Portainer access token
#   PORTAINER_STACK_ID     2
#   PORTAINER_ENDPOINT_ID  2
#
# GHCR: make familyos-api + familyos-keycloak packages Public so the host can pull.

name: Deploy stack (Portainer)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why redeploy
        required: false
        default: manual
  workflow_call:

permissions:
  contents: read

jobs:
  redeploy:
    name: Portainer / server redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        id: guard
        run: |
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          echo "ref=$REF event=$EVENT"
          if [ "$EVENT" = "pull_request" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$REF" != "refs/heads/main" ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$EVENT" != "workflow_call" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Redeploy
        id: deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail
          MODE=""

          if [ -n "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "Portainer webhook"
            code=$(curl -sS -o /tmp/pw.out -w "%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL" -H "Content-Type: application/json" --max-time 180 || echo "000")
            echo "HTTP $code"; head -c 400 /tmp/pw.out 2>/dev/null || true; echo
            if [ "$code" = "200" ] || [ "$code" = "202" ] || [ "$code" = "204" ]; then MODE=webhook; else echo "::warning::Webhook HTTP $code - falling back to API"; fi
          fi

          if [ -z "$MODE" ] && [ -n "${PORTAINER_URL:-}" ] && [ -n "${PORTAINER_API_KEY:-}" ]; then
            BASE="${PORTAINER_URL%/}"
            EP="${PORTAINER_ENDPOINT_ID:-2}"
            STACK_ID="${PORTAINER_STACK_ID:-}"
            echo "Portainer list stacks"
            list_code=$(curl -sS -o /tmp/ps.out -w "%{http_code}" -H "X-API-Key: ${PORTAINER_API_KEY}" "${BASE}/api/stacks" --max-time 60 || echo "000")
            echo "List HTTP $list_code"
            if [ "$list_code" = "200" ]; then
              python3 -c "import json;from pathlib import Path;stacks=json.loads(Path('/tmp/ps.out').read_text()); [print('  id=%s name=%r endpoint=%s'%(s.get('Id'),s.get('Name'),s.get('EndpointId'))) for s in stacks]; match=next((s for s in stacks if str(s.get('Name') or '').lower()=='familyos'),None); match and (Path('/tmp/auto_stack_id').write_text(str(match['Id'])), Path('/tmp/auto_endpoint_id').write_text(str(match.get('EndpointId') or '2')), Path('/tmp/stack_env.json').write_text(json.dumps(match.get('Env') or [])), print('Auto-matched', match.get('Name'), match.get('Id')))"
              if [ -z "$STACK_ID" ] && [ -f /tmp/auto_stack_id ]; then STACK_ID=$(cat /tmp/auto_stack_id); fi
              if [ -f /tmp/auto_endpoint_id ]; then EP=$(cat /tmp/auto_endpoint_id); fi
            fi
            if [ -n "$STACK_ID" ]; then
              if [ ! -f /tmp/stack_env.json ]; then echo '[]' > /tmp/stack_env.json; fi
              python3 -c "import json;from pathlib import Path;env=json.loads(Path('/tmp/stack_env.json').read_text());Path('/tmp/redeploy_body.json').write_text(json.dumps({'PullImage':False,'RepositoryAuthentication':False,'Env':env}))"
              echo "git/redeploy stack=$STACK_ID endpoint=$EP"
              code=$(curl -sS -o /tmp/pa.out -w "%{http_code}" -X PUT "${BASE}/api/stacks/${STACK_ID}/git/redeploy?endpointId=${EP}" -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Content-Type: application/json" --data-binary @/tmp/redeploy_body.json --max-time 300 || echo "000")
              echo "HTTP $code"; head -c 2000 /tmp/pa.out 2>/dev/null || true; echo
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then MODE=api-git; else echo "::warning::API HTTP $code"; fi
            fi
          fi

          if [ -z "$MODE" ]; then
            echo "::error::Deploy failed. Set PORTAINER_WEBHOOK_URL or API secrets (STACK_ID=2 ENDPOINT_ID=2)"
            echo "mode=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Redeploy OK via $MODE"

      - name: Health check API
        if: steps.guard.outputs.skip != 'true' && steps.deploy.outputs.mode != 'failed'
        run: |
          set -euo pipefail
          URL="https://api.18.226.226.118.sslip.io/health"
          echo "Waiting for $URL ..."
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/h.out -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            body=$(head -c 80 /tmp/h.out 2>/dev/null || true)
            echo "try $i HTTP $code $body"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::API health not 200 yet (deploy may still be starting)"
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.deploy.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://api.18.226.226.118.sslip.io/health" >> "$GITHUB_STEP_SUMMARY"

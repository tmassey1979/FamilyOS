# One-time / on-demand: generate Expo resolved config JSON + ensure eas.json is valid.
# Actions → "Generate mobile build config" → Run workflow
#
# Requires secret: EXPO_TOKEN (Expo access token)
# Optional: commits updated eas.json / app.json if EAS configure changes them

name: Generate mobile build config

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit eas.json / app.json changes back to main"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate:
    name: Generate mobile JSON config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand brand assets (best effort)
        working-directory: .
        continue-on-error: true
        run: |
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py || true
          fi
          if [[ -f scripts/seed-brand-assets.py ]]; then
            python3 scripts/seed-brand-assets.py || true
          fi

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Add GitHub secret EXPO_TOKEN (expo.dev → Access tokens)"
            exit 1
          fi

      - name: EAS whoami + project configure
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          # Non-interactive configure for Android (writes/updates eas.json metadata as needed)
          npx --yes eas-cli@latest build:configure -p android --non-interactive || \
            echo "::warning::build:configure returned non-zero (project may already be linked)"

      - name: Generate resolved Expo config JSON
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://api.18.226.226.118.sslip.io
          EXPO_PUBLIC_DEV_USER: terry.owner
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobile-config
          npx expo config --type public --json > /tmp/mobile-config/expo-config.public.json
          npx expo config --json > /tmp/mobile-config/expo-config.full.json || \
            cp /tmp/mobile-config/expo-config.public.json /tmp/mobile-config/expo-config.full.json
          cp eas.json /tmp/mobile-config/eas.json
          cp app.json /tmp/mobile-config/app.json
          # Small summary for humans
          python3 - << 'PY'
          import json
          from pathlib import Path
          pub = json.loads(Path("/tmp/mobile-config/expo-config.public.json").read_text())
          eas = json.loads(Path("/tmp/mobile-config/eas.json").read_text())
          summary = {
            "name": pub.get("name") or pub.get("expo", {}).get("name"),
            "slug": pub.get("slug") or pub.get("expo", {}).get("slug"),
            "version": pub.get("version") or pub.get("expo", {}).get("version"),
            "androidPackage": (pub.get("android") or pub.get("expo", {}).get("android") or {}).get("package"),
            "iosBundle": (pub.get("ios") or pub.get("expo", {}).get("ios") or {}).get("bundleIdentifier"),
            "easProjectId": (pub.get("extra") or pub.get("expo", {}).get("extra") or {}).get("eas", {}).get("projectId"),
            "buildProfiles": list((eas.get("build") or {}).keys()),
            "apiUrl": (eas.get("build") or {}).get("production", {}).get("env", {}).get("EXPO_PUBLIC_API_URL"),
          }
          Path("/tmp/mobile-config/mobile-build-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY
          ls -la /tmp/mobile-config/

      - name: Upload config artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-config
          path: |
            /tmp/mobile-config/expo-config.public.json
            /tmp/mobile-config/expo-config.full.json
            /tmp/mobile-config/eas.json
            /tmp/mobile-config/app.json
            /tmp/mobile-config/mobile-build-summary.json
          retention-days: 30

      - name: Commit config updates to main
        if: ${{ inputs.commit_changes }}
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/eas.json mobile/app.json || true
          if git diff --staged --quiet; then
            echo "No eas.json/app.json changes to commit"
          else
            git commit -m "chore(mobile): EAS/build config from generate-mobile-config workflow"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Summary
        run: |
          echo "## Mobile build config" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`mobile-build-config\` (expo-config + eas.json + summary)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download from this run's Artifacts panel" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/mobile-config/mobile-build-summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/mobile-config/mobile-build-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

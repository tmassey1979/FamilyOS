name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Report-only until domain coverage is filled (#14). Set true to enforce.
  DOMAIN_COVERAGE_ENFORCE: "false"
  DOMAIN_COVERAGE_MIN: "70"

jobs:
  build-and-test:
    name: Build & Test (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py

      - name: Compute version
        id: ver
        run: |
          if TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            VERSION=${TAG#v}
          else
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "0.1.0")
          fi
          SHORT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "info=$VERSION+$SHORT" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION (info $VERSION+$SHORT)"

      - name: Restore
        run: dotnet restore FamilyOS.sln

      - name: Build
        run: >
          dotnet build FamilyOS.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.ver.outputs.version }}
          -p:InformationalVersion=${{ steps.ver.outputs.info }}

      - name: Test
        run: >
          dotnet test tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[FamilyOS.Domain]*"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/**"

      - name: Domain coverage summary
        if: always()
        run: |
          set -euo pipefail
          COV=$(find coverage -name 'coverage.cobertura.xml' | head -1 || true)
          if [[ -z "${COV}" ]]; then
            echo "::warning::No cobertura file found"
            echo "Domain line coverage: n/a" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET, pathlib, sys
          paths = list(pathlib.Path('coverage').rglob('coverage.cobertura.xml'))
          if not paths:
              print('No cobertura'); sys.exit(0)
          root = ET.parse(paths[0]).getroot()
          rates = []
          for pkg in root.findall('.//package'):
              name = pkg.get('name') or ''
              if 'FamilyOS.Domain' in name or name.endswith('Domain'):
                  lr = pkg.get('line-rate')
                  if lr:
                      rates.append(float(lr))
          if not rates:
              lr = root.get('line-rate')
              rates = [float(lr)] if lr else [0.0]
          pct = max(rates) * 100.0
          min_pct = float(os.environ.get('DOMAIN_COVERAGE_MIN', '70'))
          enforce = os.environ.get('DOMAIN_COVERAGE_ENFORCE', 'false').lower() in ('1', 'true', 'yes')
          print(f'Domain line coverage: {pct:.1f}% (min {min_pct:.0f}%, enforce={enforce})')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'\n### Domain coverage\n- **{pct:.1f}%** line (target ≥ {min_pct:.0f}%, enforce={enforce})\n')
          if pct + 1e-6 < min_pct:
              msg = f'Domain coverage {pct:.1f}% below {min_pct:.0f}%'
              if enforce:
                  print(f'::error::{msg}')
                  sys.exit(1)
              print(f'::warning::{msg} (report-only; set DOMAIN_COVERAGE_ENFORCE=true to fail)')
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## CI - API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Info: ${{ steps.ver.outputs.info }}" >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EAS brand bundle (real PNGs)
        working-directory: .
        id: expand_eas_brand
        continue-on-error: true
        run: |
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py
          else
            echo "No expand-eas-brand-bundle.py - skip"
            exit 1
          fi

      - name: Expand brand assets (brand-source b64)
        working-directory: .
        id: expand_brand
        continue-on-error: true
        if: steps.expand_eas_brand.outcome != 'success'
        run: python3 scripts/expand-assets.py

      - name: Seed brand PNGs if expand failed
        working-directory: .
        if: steps.expand_eas_brand.outcome != 'success' && steps.expand_brand.outcome != 'success'
        run: |
          if [[ -f scripts/assemble-seed-brand.py ]]; then
            python3 scripts/assemble-seed-brand.py --run
          elif [[ -f scripts/seed-brand-assets.py ]]; then
            python3 scripts/seed-brand-assets.py
          else
            echo "::error::Brand expand failed and no seed fallback present"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Summary
        if: always()
        run: |
          echo "## CI - Mobile" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expo / TypeScript tsc --noEmit" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Redeploy (Portainer)
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy-stack.yml
    secrets: inherit

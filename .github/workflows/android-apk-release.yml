name: Android APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-main
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Expand brand assets
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py || true
          fi
          if [[ -f scripts/expand-assets.py ]]; then
            python3 scripts/expand-assets.py || true
          fi
          if [[ -f scripts/assemble-seed-brand.py ]]; then
            python3 scripts/assemble-seed-brand.py --run || python3 scripts/assemble-seed-brand.py
          elif [[ -f scripts/seed-brand-assets.py ]]; then
            python3 scripts/seed-brand-assets.py
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo configuration
        run: |
          npx expo install --check
          npx expo-doctor
          npx expo export --platform android

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Prepare unique Android build number
        id: version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'app.json';
          const config = JSON.parse(fs.readFileSync(p, 'utf8'));
          const version = config.expo.version;
          const buildNumber = 100000 + Number(process.env.GITHUB_RUN_NUMBER);
          config.expo.android.versionCode = Math.max(
            Number(config.expo.android.versionCode || 1),
            buildNumber,
          );
          fs.writeFileSync(p, JSON.stringify(config, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nbuild_number=${config.expo.android.versionCode}\ntag=android-v${version}-build${process.env.GITHUB_RUN_NUMBER}\n`);
          console.log(`Building FamilyOS ${version} (Android versionCode ${config.expo.android.versionCode})`);
          NODE
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build production APK with EAS
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::error::EXPO_TOKEN repository secret is required for EAS builds."
            exit 1
          fi
          eas build \
            --profile production-apk \
            --platform android \
            --non-interactive \
            --wait \
            --json > /tmp/familyos-eas-build.json
          python3 - <<'PY'
          import json, os, sys
          raw = open('/tmp/familyos-eas-build.json', encoding='utf-8').read().strip()
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f'::error::EAS returned invalid JSON: {exc}')
              print(raw[-4000:])
              sys.exit(1)
          builds = payload if isinstance(payload, list) else [payload]
          if not builds:
              print('::error::EAS returned no build records')
              sys.exit(1)
          build = builds[-1]
          status = str(build.get('status') or '').upper()
          if status not in ('FINISHED', 'COMPLETE', 'COMPLETED'):
              print(f'::error::EAS APK build did not finish successfully (status={status or "unknown"})')
              print(json.dumps(build, indent=2)[:6000])
              sys.exit(1)
          artifacts = build.get('artifacts') or {}
          url = artifacts.get('applicationArchiveUrl')
          if not url:
              print('::error::EAS finished but did not return an APK archive URL')
              sys.exit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'build_id={build.get("id", "")}\n')
              out.write(f'artifact_url={url}\n')
          print(f'Finished EAS build {build.get("id")}')
          PY

      - name: Download and verify APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="FamilyOS-android-v${VERSION}-build${BUILD_NUMBER}.apk"
          URL="${{ steps.eas.outputs.artifact_url }}"
          if ! curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${EXPO_TOKEN}" \
            "${URL}" --output "${APK}"; then
            curl --fail --location --retry 3 "${URL}" --output "${APK}"
          fi
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          unzip -l "${APK}" | grep -q 'AndroidManifest.xml'
          echo "apk_path=mobile/${APK}" >> "$GITHUB_OUTPUT"
          echo "APK verified: ${APK} ($(du -h "${APK}" | cut -f1))"
        id: apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyOS-android-apk-v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: mobile/FamilyOS-android-v${{ steps.version.outputs.version }}-build${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            "FamilyOS-android-v${VERSION}-build${BUILD_NUMBER}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FamilyOS Android v${VERSION} (build ${BUILD_NUMBER})" \
            --notes "Android APK built from main at commit ${GITHUB_SHA}.\n\nBuilt with EAS profile production-apk. This is a sideloadable APK; it is not a Google Play App Bundle." \
            --latest

      - name: Release summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## FamilyOS Android APK"
            echo "- Source branch: main"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- EAS profile: production-apk"
            echo "- APK version: ${{ steps.version.outputs.version }}"
            echo "- Android versionCode: ${{ steps.version.outputs.build_number }}"
            echo "- EAS build: https://expo.dev/accounts/tmassey1979/projects/familyos/builds/${{ steps.eas.outputs.build_id }}"
            echo "- GitHub release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"